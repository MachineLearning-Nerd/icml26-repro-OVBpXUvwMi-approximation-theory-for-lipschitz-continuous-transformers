    <line x1="340" y1="140" x2="1010" y2="140" stroke="#d6dbe7"/>
    <line x1="340" y1="440" x2="1010" y2="440" stroke="#d6dbe7"/>
    <line x1="1010" y1="125" x2="1010" y2="455" stroke="#b35a27" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="1010" y="480" font-size="14" text-anchor="middle" fill="#b35a27">1.0 limit</text>
    <g font-size="16" fill="#17203a">
      <text x="55" y="184">Claim 1: max segment norm</text>
