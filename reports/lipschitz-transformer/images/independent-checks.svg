    <rect x="340" y="370" width="2" height="30" rx="1" fill="#4f6fb5"/>
    <g font-size="15" font-weight="700" fill="#17203a">
      <text x="990" y="183" text-anchor="end">1.0000000000000009</text>
      <text x="395" y="253">0.0643</text>
      <text x="990" y="323" text-anchor="end">1.0</text>
      <text x="355" y="393">0.0</text>
    </g>
    <text x="55" y="515" font-size="14" fill="#536078">Scope: all 1,024 activation masks at d=16; attention covariance at d=32 with 512 tokens; 128-layer recurrence; complete four-point metric domain.</text>
